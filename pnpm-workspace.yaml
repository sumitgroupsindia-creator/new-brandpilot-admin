packages:
  - 'apps/*'
  - 'packages/*'

overrides:
  baseline-browser-mapping: 2.11.14
  electron-to-chromium: 1.5.408
  read-cache: 1.0.0

# pnpm requires an explicit decision for every dependency with a build
# script, otherwise install fails with ERR_PNPM_IGNORED_BUILDS.
#
# esbuild: false — its postinstall only spawns the binary to check its
# version, which fails with EACCES on hosts that mount the build dir
# noexec. The binary itself comes from @esbuild/linux-x64, so skipping
# this changes nothing at build time.
allowBuilds:
  'esbuild': false

# pnpm 10 equivalents (ignored by pnpm 11):
ignoredBuiltDependencies:
  - 'esbuild'
